[profile.default]
src = "src"
test = "test"
script = "scripts"
out = "../build/forge-out-sepolia-demo"
libs = ["../contracts/lib"]
remappings = ["contracts/=../contracts/"]
allow_paths = ["../contracts"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

[profile.deploy]
optimizer = true
optimizer_runs = 1
via_ir = false
evm_version = "cancun"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
