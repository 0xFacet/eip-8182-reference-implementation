[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "../assets" },
    { access = "read-write", path = "./out" },
]
ffi = false

additional_compiler_profiles = [
    { name = "via-ir", via_ir = true, optimizer_runs = 1 },
    { name = "small", via_ir = false, optimizer_runs = 1 },
]

compilation_restrictions = [
    # transact's 7 dynamic calldata params exceed the legacy ABI decoder's
    # stack budget; the pool alone compiles via-ir (runs=1 keeps the IR
    # inliner from duplicating the Poseidon permutation past EIP-170).
    { paths = "src/ShieldedPool.sol", via_ir = true },
    # PublicActionRouter CALLS transact with the same 7 dynamic calldata params
    # and hits the identical legacy stack limit; via-ir at runs=1.
    { paths = "src/PublicActionRouter.sol", via_ir = true, optimizer_runs = 1 },
    # bb-generated UltraHonk verifier is ~66 bytes over EIP-170 at runs=200;
    # runs=1 (size-optimized, legacy codegen) brings it under, matching the
    # sepolia-demo deploy profile.
    { paths = "src/generated/HonkVerifier.sol", optimizer_runs = 1, via_ir = false },
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
